<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>つながっていません · NIHO editor</title>
    <style>
      html { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.7 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #fcfbf8; color: #3b3222; }
      main { max-width: 28rem; padding: 2rem 1.5rem; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { margin: 1rem 0 0.5rem; font-size: 1.25rem; }
      p { margin: 0.5rem 0; }
      a { color: #4b5f73; }
      /* ダークは基本の指定より後に置く（同じ詳しさなら後ろが勝つ） */
      @media (prefers-color-scheme: dark) { body { background: #1b1a17; color: #ece8dd; } a { color: #a6d2de; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>つながっていません</h1>
      <p>ネットワークに接続できませんでした。</p>
      <p>つながったら、もう一度開いてください。</p>
      <p><a href="/">もう一度開く</a></p>
    </main>
  </body>
</html>
